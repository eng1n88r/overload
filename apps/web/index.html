<!DOCTYPE html>
<html data-bs-theme="dark" lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="48x48">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overload</title>
    <script>
      // Resolve the colour mode before first paint. Without this the document
      // would render at its hardcoded default and then flip once Vue mounts,
      // which is a visible flash of the wrong theme on every load.
      (function () {
        try {
          var mode = localStorage.getItem('appMode') || 'system';
          var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
        } catch (e) {
          /* private mode / storage disabled: the attribute below stands */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
