<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1b26"/>
      <stop offset="1" stop-color="#081119"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#2ee6b8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2ee6b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1a8f78"/>
      <stop offset="1" stop-color="#2ee6b8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#4de8c8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <!-- Bloom for the wordmark. color-interpolation-filters="sRGB" is the whole
         point: the default, linearRGB, lightens a pale glyph on a dark ground
         and the letters read as washed out rather than lit. This blurs a copy
         drawn *behind* the text, so the edges on top stay crisp. -->
    <filter id="bloom" x="-15%" y="-40%" width="130%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="880" height="250" rx="12" fill="url(#bg)"/>
  <rect width="880" height="250" rx="12" fill="url(#grid)"/>
  <rect width="880" height="250" rx="12" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="879" height="249" rx="12" fill="none" stroke="#2ee6b8" stroke-opacity="0.25"/>

  <!-- HUD corner brackets -->
  <g stroke="#2ee6b8" stroke-width="2" fill="none" stroke-opacity="0.9">
    <path d="M14 26 V16 a4 4 0 0 1 4 -4 H28"/>
    <path d="M852 12 h10 a4 4 0 0 1 4 4 V26"/>
    <path d="M866 224 v10 a4 4 0 0 1 -4 4 H852"/>
    <path d="M28 238 H18 a4 4 0 0 1 -4 -4 V224"/>
  </g>

  <!-- barbell mark in bracket box: big plates inboard, small plates outboard, bar tips showing -->
  <g transform="translate(64, 88)">
    <rect x="0" y="0" width="74" height="74" rx="10" fill="#0d2230" stroke="#2ee6b8" stroke-opacity="0.5"/>
    <g fill="#2ee6b8">
      <rect x="5" y="34" width="64" height="6" rx="3"/>
      <rect x="17" y="20" width="8" height="34" rx="4"/>
      <rect x="10" y="26" width="6" height="22" rx="3"/>
      <rect x="49" y="20" width="8" height="34" rx="4"/>
      <rect x="58" y="26" width="6" height="22" rx="3"/>
    </g>
  </g>

  <!-- wordmark + tagline -->
  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="168" y="122" font-size="46" font-weight="700" letter-spacing="10" fill="#2ee6b8" fill-opacity="0.35" filter="url(#bloom)">OVERLOAD</text>
    <text x="168" y="122" font-size="46" font-weight="700" letter-spacing="10" fill="#f4fbf9">OVERLOAD</text>
    <text x="171" y="153" font-size="15" letter-spacing="1" fill="#8fb0ab">Self-hosted workout builder, tracker &amp; training analytics</text>
    <text x="171" y="176" font-size="15" letter-spacing="1" fill="#8fb0ab">with a built-in MCP server for Claude</text>
  </g>

  <!-- progressive-overload bars + trend -->
  <g transform="translate(672, 52)">
    <g fill="url(#bar)">
      <rect x="0"   y="110" width="20" height="36" rx="3" opacity="0.55"/>
      <rect x="28"  y="96"  width="20" height="50" rx="3" opacity="0.65"/>
      <rect x="56"  y="78"  width="20" height="68" rx="3" opacity="0.75"/>
      <rect x="84"  y="86"  width="20" height="60" rx="3" opacity="0.7"/>
      <rect x="112" y="58"  width="20" height="88" rx="3" opacity="0.85"/>
      <rect x="140" y="34"  width="20" height="112" rx="3"/>
    </g>
    <polyline points="10,102 38,88 66,70 94,78 122,50 150,26" fill="none" stroke="#eaf6f2" stroke-opacity="0.85" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="150" cy="26" r="4.5" fill="#eaf6f2"/>
    <line x1="-8" y1="146" x2="168" y2="146" stroke="#4de8c8" stroke-opacity="0.4" stroke-width="1.5"/>
  </g>
</svg>
