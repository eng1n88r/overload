name: overload

# Deploys go straight to prod: build, tag as stable, up.
#   docker compose build overload-test && docker tag overload:test overload:stable && docker compose up -d overload
# overload-test is parked behind the "test" profile — a plain `up -d` leaves it
# off. To bring the playground back on :3003:
#   docker compose --profile test up -d overload-test

services:
  overload:
    image: overload:stable
    container_name: overload
    ports:
      - "3002:3001"
    environment:
      DATABASE_URL: file:/data/overload.db
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      PORT: "3001"
    volumes:
      - ./appdata:/data
    restart: unless-stopped

  # Demo-data playground: own image tag, own database. Try changes here instead
  # of on the real training log. First boot migrates and seeds the catalog
  # itself; create the demo user once with:
  #   docker exec overload-test node dist/seed-demo.js
  # Login demo@overload.example / overload-demo. Wipe = delete ./appdata-test
  # and re-run the exec.
  overload-test:
    build: .
    image: overload:test
    container_name: overload-test
    profiles: [test]
    ports:
      - "3003:3001"
    environment:
      DATABASE_URL: file:/data/overload.db
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      PORT: "3001"
    volumes:
      - ./appdata-test:/data
    restart: unless-stopped
